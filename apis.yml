aid: hyperstrong
name: HyperStrong
description: 'HyperStrong (Beijing HyperStrong Technology Co., Ltd. / 北京海博思创科技股份有限公司,
  SSE: 688411) is a leading Chinese provider of battery energy storage systems (BESS) and integrated
  energy solutions. Founded in 2011 and headquartered in Beijing, the company designs and manufactures
  modular liquid-cooled storage systems (HyperBlock and HyperCube series), integrated solar-plus-storage
  and charging-storage units, and the core control stack of battery management systems (BMS), energy
  management systems (EMS), and power conversion systems (PCS), alongside its HyperCloud AI cloud
  platform for fleet monitoring and optimization. HyperStrong serves generation-side, grid-side, and
  user-side (commercial, industrial, and residential) storage markets, ranking among the top domestic
  and global players by cumulative installed capacity with 60+ GWh deployed across 400+ projects. It
  is backed by IDG Capital and Qiming Venture Partners. This profile is maintained in the API Evangelist
  network; HyperStrong is a hardware and energy-platform company and does not publish a public developer
  API surface at this time.'
